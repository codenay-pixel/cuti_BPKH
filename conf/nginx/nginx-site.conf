server {
	listen   80;
	listen   [::]:80 default ipv6only=on;

	# Laravel: root harus mengarah ke folder public/, bukan root project.
	root /var/www/html/public;
	index index.php index.html index.htm;

	server_name _;

	sendfile off;

	error_log /dev/stdout info;
	access_log /dev/stdout;

	location /.git {
           deny all;
           return 403;
        }

	# Laravel: path yang bukan file/folder asli (semua route bernama,
	# misalnya /login, /dashboard, /cuti/ajukan) diteruskan ke index.php
	# sebagai front controller, bukan langsung 404.
	location / {
		try_files $uri $uri/ /index.php?$query_string;
	}

	error_page 404 /404.html;
        location = /404.html {
                root /var/www/errors;
                internal;
        }

        location ^~ /sad.svg {
            alias /var/www/errors/sad.svg;
            access_log off;
        }
        location ^~ /twitter.svg {
            alias /var/www/errors/twitter.svg;
            access_log off;
        }
        location ^~ /github.svg {
            alias /var/www/errors/github.svg;
            access_log off;
        }

	location ~ \.php$ {
                try_files $uri =404;
		fastcgi_split_path_info ^(.+\.php)(/.+)$;
		fastcgi_pass unix:/var/run/php-fpm.sock;
		fastcgi_param SCRIPT_FILENAME $document_root$fastcgi_script_name;
    		fastcgi_param SCRIPT_NAME $fastcgi_script_name;
		fastcgi_index index.php;
		include fastcgi_params;
	}

        location ~* \.(jpg|jpeg|gif|png|css|js|ico|webp|tiff|ttf|svg)$ {
                expires           5d;
        }

	location ~ /\. {
    		log_not_found off;
    		deny all;
	}

	location ^~ /.well-known {
                allow all;
                auth_basic off;
        }

}
